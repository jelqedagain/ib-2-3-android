# ClashMob server (README.md). `npm run dev` runs it on this PC with a local database; `npm run deploy` puts it
# on Cloudflare once database_id below is the one `npx wrangler d1 create clashmob` printed.
name = "clashmob"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
MIN_PLAY_SECONDS = "20"     # a player's scoring fights must be at least this far apart
NEW_PLAYERS_PER_DAY = "10"  # new players a day from one connection

# 100 requests a minute per connection (src/index.js, "connections")
[[ratelimits]]
name = "PER_CONNECTION"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "clashmob"
database_id = "287e01f6-dbb3-4571-aec9-68469861648d"

# The pages (src/public.html, src/admin.html) are bundled as text
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css"]
fallthrough = true
