<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClashMob Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 130px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .top .sp { flex: 1; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: linear-gradient(180deg, #232934, #181c23); border: 1px solid #3a414c;
    border-radius: 4px; padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--gold-dim); }
  button.primary { color: #1b1408; font-weight: 700; border-color: #8a6a2c; background: linear-gradient(180deg, var(--gold2), var(--gold) 55%, #a9802f);
    font-family: "Cinzel", Georgia, serif; letter-spacing: .08em; }
  button.link { background: none; border: 0; padding: 3px 6px; color: var(--muted); }
  button.link:hover { color: var(--gold2); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--field); border: 1px solid #323843; border-radius: 4px;
    padding: 7px 9px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(217, 177, 95, .18); }
  select option { background: #12161c; }
  textarea { resize: vertical; min-height: 56px; }
  textarea.raw { font: 12.5px/1.5 ui-monospace, Consolas, monospace; min-height: 440px; }
  label { display: block; font-size: 12.5px; color: var(--muted); }
  label > input, label > select, label > textarea, label > .pair, label > .prize { margin-top: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 14px; }
  .grid .wide { grid-column: 1 / -1; }
  .grid .span2 { grid-column: span 2; }
  @media (max-width: 640px) { .grid .span2 { grid-column: auto; } }
  .pair { display: grid; grid-template-columns: 1fr 110px; gap: 6px; }
  .tabs { display: flex; gap: 2px; margin: 18px 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 14px; color: var(--muted);
    font-family: "Cinzel", Georgia, serif; letter-spacing: .08em; white-space: nowrap; }
  .tabs button.on { color: var(--gold2); border-bottom-color: var(--gold); }
  details.event { padding: 0; }
  details.event > summary { list-style: none; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--ink); }
  details.event > summary::-webkit-details-marker { display: none; }
  details.event > summary::before { content: "▸"; color: var(--gold); font-size: 13px; }
  details.event[open] > summary::before { content: "▾"; }
  details.event[open] > summary { border-bottom: 1px solid #262c35; }
  .body { padding: 6px 18px 18px; }
  .stage { border: 1px solid #2a3039; border-left: 3px solid var(--gold-dim); border-radius: 4px; padding: 10px 12px; margin: 8px 0; background: rgba(0, 0, 0, .15); }
  .stagehead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .stagehead b { font-family: "Cinzel", Georgia, serif; color: var(--gold); letter-spacing: .08em; }
  .stagehead .sp { flex: 1; }
  .tier { display: grid; grid-template-columns: 90px 190px 1fr auto; gap: 10px; align-items: end; padding: 8px 0; border-bottom: 1px dashed #262c35; }
  .tier .medal { font-family: "Cinzel", Georgia, serif; font-weight: 700; letter-spacing: .06em; padding-bottom: 8px; }
  .bronze { color: #d29a6a; } .silver { color: #c9d1da; } .goldm { color: var(--gold2); }
  .prize { display: grid; grid-template-columns: minmax(150px, 1.2fr) minmax(110px, 1fr); gap: 6px; }
  @media (max-width: 640px) { .tier { grid-template-columns: 1fr; } .tier .medal { padding: 0; } .prize { grid-template-columns: 1fr; } }
  .msg { border-radius: 4px; padding: 9px 12px; margin: 8px 0; font-size: 13.5px; }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ok { background: var(--live-bg); color: var(--live); }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #161a21, #0e1115); border-top: 1px solid var(--bronze);
    padding: 10px 16px; box-shadow: 0 -8px 24px rgba(0, 0, 0, .4); }
  .dock > div { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dock .sp { flex: 1; }
  .login { max-width: 400px; margin: 14vh auto; text-align: center; }
  .login input { margin: 14px 0 6px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="login" class="panel login hidden">
    <h1>ClashMob Admin</h1>
    <form id="loginForm">
      <input id="password" type="password" autocomplete="current-password" placeholder="Admin password">
      <div id="loginMsg"></div>
      <p><button class="primary" type="submit">Enter</button></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <h1>ClashMob Admin</h1>
      <span class="sp"></span>
      <span class="small" id="clock"></span>
      <a class="small" href="/" target="_blank" style="color:var(--gold)">Public page ↗</a>
      <button class="link" id="refresh">Refresh</button>
      <button class="link" id="logout">Log out</button>
    </div>
    <div class="tabs">
      <button data-tab="live" class="on">Live</button>
      <button data-tab="edit">Events</button>
      <button data-tab="players">Players</button>
      <button data-tab="raw">Events file</button>
    </div>
    <section id="tab-live"></section>
    <section id="tab-edit" class="hidden"></section>
    <section id="tab-players" class="hidden">
      <div class="panel">
        <div class="row"><input id="playerSearch" placeholder="Search by name or id" style="max-width:320px"><span class="small" id="playerCount"></span></div>
        <div id="playerList" style="margin-top:10px"></div>
      </div>
    </section>
    <section id="tab-raw" class="hidden">
      <div class="panel">
        <p class="muted" style="margin-top:0">All the events as one text file. Edit it here if you prefer, then <b>Use this text</b> to load it into the Events tab.</p>
        <textarea class="raw" id="raw" spellcheck="false"></textarea>
        <p class="row"><button id="useRaw">Use this text</button><button id="showDefaults" class="link">Show the server's default events</button></p>
      </div>
    </section>
    <div id="result"></div>
  </div>
</main>

<div class="dock hidden" id="dock"><div>
  <span id="dirty" class="small">No changes</span>
  <span class="sp"></span>
  <button id="discard">Discard changes</button>
  <button id="check">Check</button>
  <button id="publish" class="primary">Publish</button>
</div></div>

<script>
"use strict";
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (n) => Number(n || 0).toLocaleString();

// ---- what the game's names mean ----
const KIND = { Trial: "Trial", ClashMob: "ClashMob", Tournament: "Aegis Tournament" };
const KIND_HELP = {
  Trial: "Solo. Each player's best fight earns bronze, silver and gold prizes.",
  ClashMob: "Co-op. Everyone's fights add up toward one goal per stage; when the mob reaches it, everyone who played gets the stage prize.",
  Tournament: "Competitive. Timed stages: each ranks the players' best fights, and only the top players go on to the next stage.",
};
const BOSSES = { "10ft_SnS_BlackKnight": "Dark Knight", "20ft_B_MX-Goliath": "MX-Goliath", "10ft_SnS_LavaLord": "Ember Knight", "10ft_SnS_Ashimar": "Ashimar" };
const PINS = { MapPin_Obelisk_A: "Obelisk", MapPin_Dunes_A: "Dunes", MapPin_Monastary_A: "Monastery", MapPin_ThePit: "The Pit",
  MapPin_Lake_A: "Lake", MapPin_SlotCanyon: "Slot Canyon", MapPin_Lookout: "Lookout" };
const SCENERY = { cm_obelisk_art: "Obelisk", cm_dunes_art: "Dunes", C01_CM_Monastery_Art: "Monastery" };
const SCORING = {
  BT_KillNBosses: ["Kills", "Each boss killed is 1 point (one boss per fight).", "kills"],
  BT_Kill1Boss: ["Damage", "Points are the damage done to the boss in the fight.", "damage"],
  BT_TimeSurvival: ["Survival", "Points are the seconds the player stays alive (give the boss a huge health).", "seconds"],
  BT_TreasureCollection: ["Treasure", "Points are the treasure bags collected.", "bags"],
  BT_BattleChallengeTrigger: ["Skill moves", "Advanced: points for set moves (parries, blocks...).", "moves"],
};
const PRIZES = [
  ["gold", "Gold"], ["chips", "Battle chips"],
  ["TRA_GrabBag_Uber", "ClashMob prize wheel"], ["TRA_GrabBag_Large", "Prize wheel (large)"], ["TRA_GrabBag_Medium", "Prize wheel (medium)"],
  ["TRA_GrabBag_Small", "Prize wheel (small)"], ["TRA_GrabBag_LargeGem", "Rare gem wheel"], ["TRA_GrabBag_MediumGem", "Gem wheel (medium)"],
  ["TRA_GrabBag_SmallGem", "Gem wheel (small)"], ["TRA_Item_Fixed", "An item"], ["TRA_Gem_Fixed", "A gem"],
  ["TRA_Gold_Large", "Gold by bloodline (large)"], ["TRA_Gold_Medium", "Gold by bloodline (medium)"], ["TRA_Gold_Small", "Gold by bloodline (small)"],
  ["other", "Something else (advanced)"],
];
const PRIZE_LABEL = Object.fromEntries(PRIZES);
const ITEMS = { Sword_222: "Anarchax (Siris, heavy weapon)", Magic_149: "Squee (Isa, ring)", Helmet_134: "Radian (Siris, helmet)",
  Helmet_150: "Serk (Siris, helmet)", Helmet_111: "Colossal Helm (Isa, helmet)" };
const BLOODLINE = { TRA_Gold_Large: "bloodline × 500, at most 100,000", TRA_Gold_Medium: "bloodline × 250, at most 75,000", TRA_Gold_Small: "bloodline × 100, at most 5,000" };

function prizeKind(r) {
  if (!r) return "gold";
  if (r.type === "TRA_Random_Gold") return /^chips\./i.test(r.data) ? "chips" : "gold";
  return PRIZE_LABEL[r.type] ? r.type : "other";
}
function prizeText(r) {
  if (!r) return "none";
  const k = prizeKind(r), n = parseInt((r.data || "").split(".")[1]);
  if (k === "gold") return `${num(n)} gold`;
  if (k === "chips") return `${num(n)} battle chips`;
  if (k === "TRA_Item_Fixed") return (ITEMS[r.data] || r.data || "an item").split(" (")[0];
  if (k === "TRA_Gem_Fixed") return `the gem ${r.data || "?"}`;
  if (BLOODLINE[k]) return `gold (${BLOODLINE[k]})`;
  return k === "other" ? `${r.type} ${r.data}` : PRIZE_LABEL[k];
}

// ---- time: the events file keeps UTC; the page shows the admin's own time ----
const pad2 = (n) => String(n).padStart(2, "0");
function utcToInput(s) {
  if (!s) return "";
  const d = new Date(s.endsWith("Z") ? s : s + "Z");
  return Number.isNaN(+d) ? "" : `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
const inputToUtc = (v) => (v ? new Date(v).toISOString().slice(0, 19) : "");
const when = (t) => new Date(t * 1000).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const utcText = (t) => new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC";
function span(secs) {
  secs = Math.max(0, secs);
  const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

// ---- the server ----
let password = store.get("cmAdmin") || "";
let state = null, model = [], savedIni = "";
const openEvents = new Set();   // the events folded open
const typing = new Set();       // pickers switched to "Other…" (a typed name), by model path

async function api(method, path, body, json) {
  const headers = { Authorization: "Bearer " + password };
  if (json) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, body, cache: "no-store" });
  let d = null;
  try { d = await r.json(); } catch {}
  if (r.status === 401 || r.status === 429) {
    showLogin(d?.error === "wrong password" ? "That's not the password." : d?.error || "Not allowed");
    throw new Error("auth");
  }
  return { status: r.status, data: d };
}
function showLogin(msg) {
  for (const id of ["app", "dock"]) $(id).classList.add("hidden");
  $("login").classList.remove("hidden");
  $("loginMsg").innerHTML = msg ? `<div class="msg bad">${esc(msg)}</div>` : "";
  $("password").focus();
}
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  password = $("password").value;
  try { await load(); store.set("cmAdmin", password); } catch {}
});
$("logout").addEventListener("click", () => { password = ""; store.set("cmAdmin", null); showLogin(""); });
$("refresh").addEventListener("click", () => load(true).then(() => currentTab === "players" && loadPlayers()).catch(() => {}));

async function load(keepEdits) {
  const { data } = await api("GET", "/admin/api/state");
  state = data;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("clock").textContent = `${num(state.players)} players · server time ${utcText(state.now)}`;
  renderLive();
  if (!keepEdits || !isDirty()) {
    savedIni = state.ini;
    model = parseIni(state.ini);
    $("raw").value = state.ini;
    renderEdit();
  }
  updateDirty();
}

// ---- Live ----
const who = (r) => r.name || "Player " + String(r.player).replace(/^port-/, "").slice(0, 6);
function renderLive() {
  const now = state.now, order = { live: 0, upcoming: 1, ended: 2 };
  const events = [...state.events].sort((a, b) => order[a.status] - order[b.status]);
  $("tab-live").innerHTML = events.map((e) => {
    const status = e.status === "live" ? "Live" : e.status === "upcoming" ? "Coming soon" : "Ended";
    const time = e.status === "live" ? `${span(e.end - now)} left · ends ${when(e.end)}` : e.status === "upcoming" ? `starts ${when(e.start)}` : `ended ${when(e.end)}`;
    const parts = e.stages || [e], cur = e.stages ? e.stages[e.activeStage] : e;
    const rows = parts.map((s, i) => {
      const active = e.stages && i === e.activeStage;
      const prog = e.kind === "ClashMob" ? `${num(Math.min(s.total, s.goal))} / ${num(s.goal)}${s.won ? " ✓" : ""}` : "";
      const prize = e.kind === "Trial" ? s.rewards.map(prizeText).join(" · ") : prizeText(s.rewards[0]);
      return `<tr${active ? ' style="color:var(--gold2)"' : ""}><td>${e.stages ? `Stage ${i + 1}` : "Event"}</td>
        <td>${e.kind === "Tournament" && e.stages ? `${when(s.start)} → ${when(s.end)}` : ""}</td><td class="n">${prog}</td>
        <td class="n">${num(s.players)}</td><td class="n">${num(s.scorers)}</td><td>${esc(prize)}</td></tr>`;
    }).join("");
    const bar = e.kind === "ClashMob" ? `<div class="bar"><div style="width:${Math.min(100, (100 * cur.total) / cur.goal)}%"></div></div>` : "";
    const top = cur.top.length ? `<details><summary>Top ${cur.top.length}${e.stages ? ` in stage ${e.activeStage + 1}` : ""}</summary><table>${cur.top.map((r, i) =>
      `<tr${i ? "" : ' class="rank1"'}><td>${i + 1}</td><td>${esc(who(r))}</td><td class="small">${esc(r.player)}</td><td class="n">${num(r.score)}</td></tr>`).join("")}</table></details>` : "";
    return `<div class="panel">
      <div class="row"><span class="kind">${esc(KIND[e.kind])}</span><span class="chip ${e.status}">${status}</span><span class="small">${time}</span></div>
      <h2 style="margin:8px 0 2px">${esc(e.title || e.name)}</h2>
      ${bar}
      <table style="margin-top:8px"><tr><th></th><th>${e.kind === "Tournament" && e.stages ? "Runs" : ""}</th><th class="n">${e.kind === "ClashMob" ? "Mob progress" : ""}</th>
        <th class="n">Joined</th><th class="n">Played</th><th>Prize</th></tr>${rows}</table>${top}</div>`;
  }).join("") || `<p class="muted">No events.</p>`;
}

// ---- Players ----
let playerTimer = 0;
async function loadPlayers() {
  const q = $("playerSearch").value.trim();
  const { data } = await api("GET", "/admin/api/players?q=" + encodeURIComponent(q));
  $("playerCount").textContent = `${data.players.length}${data.players.length === 200 ? "+" : ""} shown, most recently seen first`;
  $("playerList").innerHTML = data.players.length ? `<table><tr><th>Name</th><th>Id</th><th class="n">Fights</th><th>Last seen</th><th></th></tr>${data.players.map((p) =>
    `<tr><td>${p.name ? esc(p.name) : '<span class="muted">no name</span>'}</td><td class="small">${esc(p.id)}</td><td class="n">${num(p.plays)}</td>
      <td class="small">${when(p.seen)}</td><td style="white-space:nowrap"><button class="link" data-rename="${esc(p.id)}" data-name="${esc(p.name || "")}">Rename</button>
      ${p.name ? `<button class="link danger" data-clear="${esc(p.id)}">Remove name</button>` : ""}</td></tr>`).join("")}</table>` : `<p class="muted">No players found.</p>`;
}
$("playerSearch").addEventListener("input", () => { clearTimeout(playerTimer); playerTimer = setTimeout(() => loadPlayers().catch(() => {}), 300); });
$("playerList").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const id = b.dataset.rename || b.dataset.clear;
  let name = "";
  if (b.dataset.rename) {
    name = prompt("New name (3 to 16 letters, numbers and spaces):", b.dataset.name);
    if (name === null) return;
  } else if (!confirm("Remove this player's name? They show as \"Player …\" until they pick a new one.")) return;
  try {
    const { data } = await api("POST", "/admin/api/players/name", JSON.stringify({ id, name }), true);
    if (!data.ok) alert(data.error);
    loadPlayers();
  } catch {}
});

// ---- the events file <-> the editor ----
const SERVER_KEYS = ["Type", "Mode", "Days", "Hours", "Start", "Repeat", "StageHours", "Goal", "Score", "MaxScore", "TopPercent"];
const EVENT_FIELDS = ["Title", "Desc", "BattleType", "BossObj", "BossLevel", "BossScaledLevel", "BossHealth", "EndTime", "MaxPlays", "MapName", "SubMapName", "QuestMapPin"];
const STAGE_FIELDS = ["Desc", "BossObj", "BossLevel", "BossScaledLevel", "BossHealth", "EndTime"];

function parseIni(text) {
  const events = [], byName = {};
  const event = (name) => {
    if (!byName[name]) events.push((byName[name] = { name, keys: {}, fields: {}, rewards: [], other: [], stages: [] }));
    return byName[name];
  };
  let cur = null;
  for (let line of text.split("\n")) {
    line = line.replace(/[\r ]+$/, "");
    if (!line || line[0] === ";") continue;
    const m = line.match(/^\[(.*)\]$/);
    if (m) {
      const [name, n] = m[1].split(".");
      if (n === undefined) cur = event(name);
      else event(name).stages.push((cur = { n, keys: {}, fields: {}, rewards: [], other: [] }));
      continue;
    }
    if (!cur) continue;
    const eq = line.indexOf("="), key = eq < 0 ? line : line.slice(0, eq), value = eq < 0 ? "" : line.slice(eq + 1);
    const stage = "n" in cur;
    if (key === ".RewardType") cur.rewards.push({ type: value, data: "", goal: "" });
    else if (key === ".RewardData" && cur.rewards.length) cur.rewards[cur.rewards.length - 1].data = value;
    else if (key === ".RewardGoal" && cur.rewards.length) cur.rewards[cur.rewards.length - 1].goal = value;
    else if (SERVER_KEYS.includes(key) && (!stage || ["Goal", "MaxScore"].includes(key))) cur.keys[key === "Mode" ? "Type" : key] = value;
    else if ((stage ? STAGE_FIELDS : EVENT_FIELDS).includes(key)) cur.fields[key] = value;
    else cur.other.push(line);
  }
  for (const e of events) {
    e.stages.sort((a, b) => a.n - b.n);
    const t = (e.keys.Type || "ClashMob").toLowerCase();
    e.keys.Type = t.startsWith("tr") || t === "solo" ? "Trial" : t.startsWith("to") || t === "comp" ? "Tournament" : "ClashMob";
  }
  return events;
}

function toIni(events) {
  const out = [];
  const put = (k, v) => { if (v !== undefined && v !== null && v !== "") out.push(`${k}=${v}`); };
  const rewards = (list) => list.forEach((r) => out.push(`.RewardType=${r.type}`, `.RewardData=${r.data || ""}`, `.RewardGoal=${r.goal || 1}`));
  for (const e of events) {
    const k = e.keys, f = e.fields, type = k.Type;
    out.push(`[${e.name}]`);
    put("Type", type);
    put("Days", k.Days); put("Hours", k.Hours); put("Start", k.Start); put("Repeat", k.Repeat);
    if (type === "Tournament") { put("StageHours", k.StageHours); put("TopPercent", k.TopPercent); }
    if (!e.stages.length) put("Goal", k.Goal);
    put("Score", k.Score); put("MaxScore", k.MaxScore);
    for (const key of EVENT_FIELDS) if (!["MapName", "SubMapName", "QuestMapPin"].includes(key)) put(key, f[key]);
    if (!e.stages.length) rewards(e.rewards);
    put("MapName", f.MapName || "00_ClashMob_BaseScripting"); put("SubMapName", f.SubMapName); put("QuestMapPin", f.QuestMapPin);
    out.push(...e.other.filter((l) => l.trim()), "");
    e.stages.forEach((s, i) => {
      out.push(`[${e.name}.${i + 1}]`);
      if (type === "ClashMob") put("Goal", s.keys.Goal);
      put("MaxScore", s.keys.MaxScore);
      for (const key of STAGE_FIELDS) put(key, s.fields[key]);
      rewards(s.rewards);
      out.push(...s.other.filter((l) => l.trim()), "");
    });
  }
  return "\n" + out.join("\n");
}
const isDirty = () => toIni(model).trim() !== toIni(parseIni(savedIni)).trim();

const opt = (map, value, other) => Object.entries(map).map(([v, t]) => `<option value="${esc(v)}"${v === value ? " selected" : ""}>${esc(t)}</option>`).join("") +

const inp = (label, path, value, attrs = "", hint = "") =>

// A choice from a list, with "Other…" for any other name the game has (bosses, map spots, scenery)
function pick(label, path, value, map, hint = "") {

  return `<label>${label}<select data-pick="${path}">${!value && !custom ? `<option value="" selected>Choose…</option>` : ""}${opt(map, custom ? null : value, custom ? "selected" : "other")}</select>

function prizeInput(path, r) {
  const k = prizeKind(r), amount = parseInt(((r && r.data) || "").split(".")[1]) || "";
  let second = `<span></span>`;
  if (k === "gold" || k === "chips") second = `<input type="number" min="1" data-amount="${path}" value="${amount}" placeholder="how many">`;
  else if (k === "TRA_Item_Fixed") {
    const custom = typing.has(path) || (r.data && !(r.data in ITEMS));
    second = `<div><select data-item="${path}">${opt(ITEMS, custom ? null : r.data, custom ? "selected" : "other")}</select>` +
      (custom ? `<input data-path="${path}.data" value="${esc(r.data)}" placeholder="the game's item name, like Sword_222" style="margin-top:6px">` : "") + `</div>`;
  } else if (k === "TRA_Gem_Fixed") second = `<input data-path="${path}.data" value="${esc(r.data)}" placeholder="the game's gem name">`;

function whenHtml(e, p) {

// model paths: "0.stages.1.keys.Goal" -> [the object holding it, "Goal"]; missing objects and arrays are made
function at(path) {
  const parts = path.split(".");
  let o = model;
  for (let i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] === undefined) o[parts[i]] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    o = o[parts[i]];
  }
  return [o, parts[parts.length - 1]];
}
function reward(path) {
  const [o, k] = at(path);
  if (!o[k]) o[k] = { type: "TRA_Random_Gold", data: "GOLD.10000", goal: "1" };
  return o[k];
}
const changed = (rerender) => { if (rerender) renderEdit(); updateDirty(); $("raw").value = toIni(model); };

$("tab-edit").addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (d.classList?.contains("event")) d.open ? openEvents.add(d.dataset.name) : openEvents.delete(d.dataset.name);
}, true);

$("tab-edit").addEventListener("input", (ev) => {
  const el = ev.target, ds = el.dataset;
  if (ds.path) {
    const [o, k] = at(ds.path);
    const v = ds.lines ? el.value.split("\n") : el.value;
    if (/^\d+\.name$/.test(ds.path)) { if (openEvents.delete(o[k])) openEvents.add(v); el.closest("details.event").dataset.name = v; }
    o[k] = v;
    if (/^\d+\.fields\.Title$/.test(ds.path)) el.closest("details.event").querySelector("summary .title").textContent = v || o.name;
    return changed(false);
  }
  if (ds.amount) {
    const r = reward(ds.amount);
    r.data = `${prizeKind(r) === "chips" ? "CHIPS" : "GOLD"}.${parseInt(el.value) || 0}`;
    return changed(false);
  }
  if (ds.dur) {
    const k = model[+ds.dur].keys, unit = el.closest(".pair").querySelector("select").value;
    if (unit === "hours") { k.Hours = el.value; delete k.Days; } else { k.Days = el.value; delete k.Hours; }
    return changed(false);
  }
});

$("tab-edit").addEventListener("change", (ev) => {
  const el = ev.target, ds = el.dataset;
  if (ds.prize) {
    const r = reward(ds.prize), kind = el.value, old = prizeKind(r);
    const amount = parseInt((r.data || "").split(".")[1]);
    const money = old === "gold" || old === "chips";
    if (kind === "gold") Object.assign(r, { type: "TRA_Random_Gold", data: `GOLD.${money ? amount : 10000}` });
    else if (kind === "chips") Object.assign(r, { type: "TRA_Random_Gold", data: `CHIPS.${money ? Math.min(amount, 100) : 10}` });
    else if (kind === "TRA_Item_Fixed") Object.assign(r, { type: kind, data: "Sword_222" });
    else if (kind !== "other") Object.assign(r, { type: kind, data: "" });
    typing.delete(ds.prize);
    return changed(true);
  }
  if (ds.item) {
    const r = reward(ds.item);
    if (el.value === "__other") { typing.add(ds.item); r.data = ""; } else { typing.delete(ds.item); r.data = el.value; }
    return changed(true);
  }
  if (ds.pick) {
    const [o, k] = at(ds.pick);
    if (el.value === "__other") { typing.add(ds.pick); o[k] = ""; } else { typing.delete(ds.pick); o[k] = el.value; }
    return changed(true);
  }
  if (ds.start) { model[+ds.start].keys.Start = inputToUtc(el.value); return changed(true); }
  if (ds.repeat) { const k = model[+ds.repeat].keys; if (el.value === "1") delete k.Repeat; else k.Repeat = "0"; return changed(true); }
  if (ds.unit) {
    const k = model[+ds.unit].keys, v = k.Hours || k.Days || "7";
    if (el.value === "hours") { k.Hours = String(k.Hours ? v : (parseFloat(v) || 7) * 24); delete k.Days; }
    else { k.Days = String(k.Days ? v : Math.max(1, Math.round((parseFloat(v) || 168) / 24))); delete k.Hours; }
    return changed(true);
  }
  if (ds.path && /\.(keys\.Type|fields\.BattleType|keys\.StageHours|keys\.TopPercent|keys\.Days)$/.test(ds.path)) return changed(true);
});

const uniqueName = (base) => { let n = base, i = 2; while (model.some((e) => e.name === n)) n = base + i++; return n; };

$("tab-edit").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-act]");
  if (!b) return;
  ev.preventDefault();
  const act = b.dataset.act, e = model[b.dataset.e];
  if (act === "addReward") {
    const list = at(b.dataset.path + ".x")[0], last = list[list.length - 1];
    list.push({ type: "TRA_Random_Gold", data: "GOLD.10000", goal: String(last ? (parseInt(last.goal) || 1) * 2 : 1) });
  } else if (act === "delReward") at(b.dataset.path + ".x")[0].splice(+b.dataset.i, 1);
  else if (act === "addStage") {
    if (!e.stages.length) {
      e.stages.push({ n: "1", keys: { Goal: e.keys.Goal }, fields: { Desc: e.fields.Desc || "" }, rewards: e.rewards.slice(0, 1), other: [] });
      e.rewards = []; delete e.keys.Goal; delete e.fields.Desc;
    }
    const next = structuredClone(e.stages[e.stages.length - 1]);
    if (next.keys.Goal) next.keys.Goal = String((parseInt(next.keys.Goal) || 50) * 2);
    e.stages.push(next);
  } else if (act === "delStage") {
    if (!confirm("Remove this stage?")) return;
    e.stages.splice(+b.dataset.i, 1);
    if (!e.stages.length) e.rewards = [{ type: "TRA_Random_Gold", data: "GOLD.10000", goal: "1" }];
  } else if (act === "moveStage") {
    const i = +b.dataset.i, j = i + +b.dataset.d;
    [e.stages[i], e.stages[j]] = [e.stages[j], e.stages[i]];
  } else if (act === "moveEvent") {
    const i = +b.dataset.e, j = i + +b.dataset.d;
    [model[i], model[j]] = [model[j], model[i]];
  } else if (act === "dupEvent") {
    const c = structuredClone(e);
    c.name = uniqueName(e.name);
    c.fields.Title = (c.fields.Title || c.name) + " (copy)";
    openEvents.add(c.name);
    model.splice(+b.dataset.e + 1, 0, c);
  } else if (act === "delEvent") {
    if (!confirm(`Delete "${e.fields.Title || e.name}"? Once you publish, its players lose their progress in it.`)) return;
    model.splice(+b.dataset.e, 1);
  } else if (act === "addEvent") {
    const t = TEMPLATES[b.dataset.type]();
    t.name = uniqueName(t.name);
    openEvents.add(t.name);
    model.push(t);
  } else if (act === "reset") {
    if (!confirm("Go back to the server's own default events? This goes live at once, and players lose their progress in events that change.")) return;
    try {
      await api("DELETE", "/admin/api/events");
      await load();
      showResult(`<div class="panel"><div class="msg ok">The server's default events are live again.</div></div>`);
    } catch {}
    return;
  }
  typing.clear();  // (paths may have moved)
  changed(true);
});

    `<tr><td><span class="kind">${esc(KIND[c.kind])}</span><br>${esc(model.find((e) => e.name === c.name)?.fields.Title || c.name)}</td>
      <td>${when(c.start)}<div class="small">${utcText(c.start)}</div></td><td>${when(c.end)}<div class="small">${utcText(c.end)}</div></td></tr>` +
    c.stages.map((s, i) => `<tr class="small"><td>&nbsp;&nbsp;Stage ${i + 1}${c.kind === "ClashMob" ? ` · mob goal ${num(s.goal)}` : ""}</td>
      <td>${c.kind === "Tournament" ? when(s.start) : ""}</td><td>${c.kind === "Tournament" ? when(s.end) : ""}</td></tr>`).join("")).join("")}</table>`;
}
async function check(save) {
  const bad = model.find((e) => !/^[A-Za-z0-9_-]{1,40}$/.test(e.name)) || model.find((e, i) => model.findIndex((x) => x.name === e.name) !== i);
  if (bad) return showResult(`<div class="panel"><div class="msg bad">The id "${esc(bad.name)}" (under Advanced) is not valid or is used twice.</div></div>`);
  const { data } = await api(save ? "PUT" : "POST", save ? "/admin/api/events" : "/admin/api/check", toIni(model));
  if (!data.ok) return showResult(`<div class="panel"><div class="msg bad">This can't go live: ${esc(data.error)}</div></div>`);
  const warn = data.warnings.map((w) => `<div class="msg warn">${esc(w)}</div>`).join("");
  showResult(`<div class="panel">${save ? `<div class="msg ok">Published. Players see it when their game next refreshes its ClashMobs (when it starts, and every 20 minutes).</div>`
    : `<div class="msg ok">This can go live. Nothing changes until you publish.</div>`}${warn}<div class="rule">Schedule</div>${scheduleTable(data.schedule)}</div>`);
  return data;
}
$("check").addEventListener("click", () => check(false).catch(() => {}));
$("publish").addEventListener("click", async () => {
  try {
    const d = await check(false);
    if (!d?.ok) return;
    const extra = d.warnings.length ? `\n\nWarnings:\n- ${d.warnings.join("\n- ")}` : "";
    if (!confirm(`Publish? The events go live for everyone at once.${extra}`)) return;
    await check(true);
    await load();
  } catch {}
});
$("discard").addEventListener("click", () => {
  if (!confirm("Throw away your changes?")) return;
  model = parseIni(savedIni);
  typing.clear();
  changed(true);
  $("result").innerHTML = "";
});

// ---- tabs ----
let currentTab = "live";
function showTab(name) {
  currentTab = name;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of ["live", "edit", "players", "raw"]) $("tab-" + t).classList.toggle("hidden", t !== name);
  $("dock").classList.toggle("hidden", !["edit", "raw"].includes(name));
  if (name === "raw") $("raw").value = toIni(model);
  if (name === "players") loadPlayers().catch(() => {});
}
document.querySelector(".tabs").addEventListener("click", (e) => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); });
window.addEventListener("beforeunload", (e) => { if (state && isDirty()) e.preventDefault(); });

if (password) load().catch(() => {}); else showLogin("");
</script>
