<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClashMobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  main { max-width: 860px; margin: 0 auto; padding: 34px 16px 56px; }
  header { text-align: center; margin-bottom: 26px; }
  header p { margin: 8px 0 0; color: var(--muted); }
  .panel h2 { margin: 8px 0 4px; font-size: 21px; }
  .when { margin-left: auto; font-size: 13px; color: var(--muted); }
  .desc { margin: 4px 0 10px; color: #cfc7b4; }
  .prize { color: var(--gold2); font-weight: 600; }
  ol { margin: 6px 0 0; padding-left: 26px; }
  ol li { padding: 2px 0; }
  ol li span { float: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  ol li:first-child { color: var(--gold2); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  footer { margin-top: 26px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>ClashMobs</h1>
    <p>Live community events for the IB3 Android port. Play them from the world map.</p>
  </header>
  <div id="events"><div class="empty">Loading…</div></div>
  <footer id="updated"></footer>
</main>
<script>
const KIND = { Trial: "Trial", ClashMob: "ClashMob", Tournament: "Aegis Tournament" };
const ITEMS = { Sword_222: "Anarchax", Magic_149: "Squee", Helmet_134: "Radian", Helmet_150: "Serk", Helmet_111: "Colossal Helm" };
const WHEELS = { TRA_GrabBag_Uber: "ClashMob prize wheel", TRA_GrabBag_Large: "Large prize wheel", TRA_GrabBag_Medium: "Prize wheel",
  TRA_GrabBag_Small: "Small prize wheel", TRA_GrabBag_LargeGem: "Rare gem wheel", TRA_GrabBag_MediumGem: "Gem wheel", TRA_GrabBag_SmallGem: "Small gem wheel",
  TRA_Gold_Large: "Gold", TRA_Gold_Medium: "Gold", TRA_Gold_Small: "Gold", TRA_Chips_Large: "15 battle chips", TRA_Chips_Medium: "10 battle chips", TRA_Chips_Small: "5 battle chips" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (n) => Number(n || 0).toLocaleString();
function span(secs) {
  secs = Math.max(0, secs);
  const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
const date = (t) => new Date(t * 1000).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const who = (r) => r.name || "Player " + String(r.player).replace(/^port-/, "").slice(0, 6);
function prize(r) {
  if (!r) return "";
  const { type, data } = r;
  if (type === "TRA_Random_Gold") { const [k, n] = data.split("."); return `${num(n)} ${/chips/i.test(k) ? "battle chips" : "gold"}`; }
  if (type === "TRA_Item_Fixed") return ITEMS[data] || "an item";
  if (type === "TRA_Gem_Fixed") return "a gem";
  return WHEELS[type] || "";
}
function topList(list) {
  if (!list.length) return "";
  return `<details><summary>Top players</summary><ol>${list.map((r) => `<li>${esc(who(r))}<span>${num(r.score)}</span></li>`).join("")}</ol></details>`;
}
function card(e, now) {
  const status = e.status === "live" ? "Live" : e.status === "upcoming" ? "Coming soon" : "Ended";
  const when = e.status === "live" ? `${span(e.end - now)} left` : e.status === "upcoming" ? `Starts ${date(e.start)}` : `Ended ${date(e.end)}`;
  let body = "";
  const cur = e.stages ? e.stages[e.activeStage] : e;
  if (e.stages) {
    body += `<div class="stages">${e.stages.map((s, i) => {
      const done = s.won || (e.kind === "Tournament" && now >= s.end);
      return `<span class="stage-pill ${done ? "done" : i === e.activeStage && e.status === "live" ? "now" : ""}">Stage ${i + 1}</span>`;
    }).join("")}</div>`;
  }
  if (cur.desc) body += `<p class="desc">${esc(cur.desc)}</p>`;
  if (e.kind === "ClashMob") {
    body += `<div class="bar"><div style="width:${Math.min(100, (100 * cur.total) / cur.goal)}%"></div></div>
      <div class="small">${e.stages ? `Stage ${e.activeStage + 1} of ${e.stages.length}: ` : ""}${num(Math.min(cur.total, cur.goal))} of ${num(cur.goal)} · mob size ${num(cur.players)}</div>`;
  } else if (e.kind === "Tournament") {
    body += `<div class="small">Stage ${e.activeStage + 1} of ${e.stages?.length || 1}${e.status === "live" ? `, ends ${date(cur.end)}` : ""} · ${num(cur.players)} players in this stage</div>`;
  } else {
    body += `<div class="small">${num(e.players)} players · your best fight counts</div>`;
  }
  const p = prize(e.kind === "Trial" ? cur.rewards[cur.rewards.length - 1] : cur.rewards[0]);
  if (p) body += `<div class="small" style="margin-top:4px">${e.kind === "Trial" ? "Top prize" : "Prize"}: <span class="prize">${esc(p)}</span></div>`;
  body += topList(cur.top);
  return `<section class="panel">
    <div class="row"><span class="kind">${esc(KIND[e.kind] || e.kind)}</span><span class="chip ${e.status}">${status}</span><span class="when">${when}</span></div>
    <h2>${esc(e.title || e.name)}</h2>${body}</section>`;
}
async function load() {
  const box = document.getElementById("events");
  try {
    const d = await (await fetch("/status", { cache: "no-store" })).json();
    const order = { live: 0, upcoming: 1, ended: 2 };
    d.events.sort((a, b) => order[a.status] - order[b.status]);
    box.innerHTML = d.events.length ? d.events.map((e) => card(e, d.now)).join("") : `<div class="empty">No events right now.</div>`;
    document.getElementById("updated").textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every minute`;
  } catch {
    box.innerHTML = `<div class="empty">Could not load the events. Try again in a minute.</div>`;
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
